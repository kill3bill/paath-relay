name: renew-paath-cert
on:
  schedule:
    - cron: "0 3 1,15 * *"   # 03:00 on the 1st and 15th: each run commits, so one failed run never leaves 60 quiet days)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lego
        run: |
          VER=4.17.4
          curl -sSL "https://github.com/go-acme/lego/releases/download/v${VER}/lego_v${VER}_linux_amd64.tar.gz" | tar xz lego
          sudo mv lego /usr/local/bin/
      - name: Issue certificate (ACME DNS-01 via DuckDNS)
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          lego --accept-tos --email "${{ secrets.ACME_EMAIL }}" \
               --dns duckdns --key-type ec256 \
               --domains paath.duckdns.org run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundle
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          BUNDLE_AES_KEY: ${{ secrets.BUNDLE_AES_KEY }}
        run: |
          pip install -r requirements.txt
          python publish.py \
            .lego/certificates/paath.duckdns.org.crt \
            .lego/certificates/paath.duckdns.org.key \
            bundle.txt
      - name: Commit bundle
        run: |
          git config user.name "paath-relay-bot"
          git config user.email "paath-relay-bot@users.noreply.github.com"
          git add bundle.txt
          git diff --staged --quiet || git commit -m "chore: renew cert bundle"
          git push
